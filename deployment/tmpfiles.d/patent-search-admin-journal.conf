# Read existing files, traverse the namespace root, and inherit read-only ACLs.
# Avoid the conditional X permission, which requires systemd 254 or newer.
A+ /var/log/journal/%m.patent-search - - - - g:patent-search-journal-readers:r--
a+ /var/log/journal/%m.patent-search - - - - g:patent-search-journal-readers:r-x,d:g:patent-search-journal-readers:r--
A+ /run/log/journal/%m.patent-search - - - - g:patent-search-journal-readers:r--
a+ /run/log/journal/%m.patent-search - - - - g:patent-search-journal-readers:r-x,d:g:patent-search-journal-readers:r--
