rule_files:
  - alert_rules.yml

evaluation_interval: 1m

tests:
  - name: candidate alerts trigger and recover
    interval: 1m
    input_series:
      - series: 'patent_search_http_requests_total{status="200",code="0",method="GET",route="/api/patent/detail/{patent_id}"}'
        values: '0+100x40'
      - series: 'patent_search_http_requests_total{status="500",code="50002",method="GET",route="/test"}'
        values: '0+10x20 200+0x20'
      - series: 'patent_search_http_requests_total{status="503",code="50301",method="POST",route="/api/patent/search"}'
        values: '0+5x20 100+0x20'
      - series: 'patent_search_http_requests_total{status="504",code="50401",method="POST",route="/api/patent/search"}'
        values: '0+3x20 60+0x20'
      - series: 'patent_search_http_request_duration_seconds_bucket{le="1"}'
        values: '0+50x20 1000+100x20'
      - series: 'patent_search_http_request_duration_seconds_bucket{le="5"}'
        values: '0+60x20 1200+100x20'
      - series: 'patent_search_http_request_duration_seconds_bucket{le="30"}'
        values: '0+70x20 1400+100x20'
      - series: 'patent_search_http_request_duration_seconds_bucket{le="240"}'
        values: '0+80x20 1600+100x20'
      - series: 'patent_search_http_request_duration_seconds_bucket{le="300"}'
        values: '0+90x20 1800+100x20'
      - series: 'patent_search_http_request_duration_seconds_bucket{le="+Inf"}'
        values: '0+100x40'
      - series: 'patent_search_bulkhead_rejections_total{bulkhead="global"}'
        values: '0+10x20 200+0x20'
      - series: 'patent_search_opensearch_calls_total{operation="search",outcome="timeout"}'
        values: '0+5x20 100+0x20'
      - series: 'patent_search_probe_status{job="patent-search-service",instance="instance-a",probe="ready"}'
        values: '0x20 1x20'
      - series: 'patent_search_service_start_time_seconds{job="patent-search-service",instance="instance-a"}'
        values: '1000x10 2000x30'

    alert_rule_test:
      - eval_time: 15m
        alertname: PatentSearchHigh5xxRatio
        exp_alerts:
          - exp_labels: {severity: warning, threshold_status: candidate}
            exp_annotations:
              summary: Patent search 5xx ratio is above the initial 5% candidate threshold
              possible_causes: Unknown application errors, overload, or dependency failures
              investigation: Split requests by code and compare dependency and bulkhead panels
              mitigation: Stop the canary or roll back the current service revision if errors began after release
              runbook: docs/ops/observability.md#alert-response
      - eval_time: 30m
        alertname: PatentSearchHigh5xxRatio
        exp_alerts: []

      - eval_time: 15m
        alertname: PatentSearchHigh503Ratio
        exp_alerts:
          - exp_labels: {severity: warning, threshold_status: candidate}
            exp_annotations:
              summary: Patent search 503 ratio is above the initial 2% candidate threshold
              possible_causes: Application bulkhead rejection or OpenSearch unavailability
              investigation: Split 50301 overload from 50302 dependency unavailable and inspect in-flight capacity
              mitigation: Stop traffic growth; roll back only when the rise correlates with the current revision
              runbook: docs/ops/observability.md#alert-response
      - eval_time: 30m
        alertname: PatentSearchHigh503Ratio
        exp_alerts: []

      - eval_time: 15m
        alertname: PatentSearchHigh504Ratio
        exp_alerts:
          - exp_labels: {severity: critical, threshold_status: candidate}
            exp_annotations:
              summary: Patent search 504 ratio is above the initial 1% candidate threshold
              possible_causes: OpenSearch timeout or exhausted end-to-end request deadline
              investigation: Compare 50401 requests with OpenSearch timeout outcomes and latency buckets
              mitigation: Stop the canary or traffic increase and use the verified release rollback entry
              runbook: docs/ops/observability.md#alert-response
      - eval_time: 30m
        alertname: PatentSearchHigh504Ratio
        exp_alerts: []

      - eval_time: 15m
        alertname: PatentSearchP95LatencyHigh
        exp_alerts:
          - exp_labels: {severity: warning, threshold_status: candidate}
            exp_annotations:
              summary: Patent search P95 latency is above the initial 5 second candidate threshold
              possible_causes: Slow queries, application saturation, or dependency latency
              investigation: Split latency by route and compare bulkhead utilization and OpenSearch duration
              mitigation: Stop traffic growth and roll back the current revision if the regression is release-linked
              runbook: docs/ops/observability.md#alert-response
      - eval_time: 30m
        alertname: PatentSearchP95LatencyHigh
        exp_alerts: []

      - eval_time: 15m
        alertname: PatentSearchP99LatencyHigh
        exp_alerts:
          - exp_labels: {severity: critical, threshold_status: candidate}
            exp_annotations:
              summary: Patent search P99 latency is above the initial 30 second candidate threshold
              possible_causes: Long-tail queries, saturation, dependency stalls, or deadline pressure
              investigation: Inspect route-level P99, in-flight gauges, rejections, and OpenSearch timeouts
              mitigation: Stop the canary or traffic increase and roll back the verified service revision when appropriate
              runbook: docs/ops/observability.md#alert-response
      - eval_time: 30m
        alertname: PatentSearchP99LatencyHigh
        exp_alerts: []

      - eval_time: 15m
        alertname: PatentSearchBulkheadRejecting
        exp_alerts:
          - exp_labels: {severity: warning, threshold_status: candidate}
            exp_annotations:
              summary: Patent search bulkheads rejected more than 5 requests in the rolling 5 minute window
              possible_causes: Heavy-search saturation or global application overload
              investigation: Compare global and heavy_search capacity, in-flight, and rejection series
              mitigation: Stop traffic growth; do not raise capacity without Issue 49 calibration evidence
              runbook: docs/ops/observability.md#alert-response
      - eval_time: 30m
        alertname: PatentSearchBulkheadRejecting
        exp_alerts: []

      - eval_time: 15m
        alertname: PatentSearchDependencyTimeouts
        exp_alerts:
          - exp_labels: {severity: critical, threshold_status: candidate}
            exp_annotations:
              summary: Patent search observed more than 2 OpenSearch timeouts in the rolling 5 minute window
              possible_causes: Dependency latency, network timeout, or exhausted request deadline
              investigation: Compare operation outcomes, retry rate, duration histogram, and 50401 responses
              mitigation: Stop the canary or traffic increase and follow the verified service rollback entry
              runbook: docs/ops/observability.md#alert-response
      - eval_time: 30m
        alertname: PatentSearchDependencyTimeouts
        exp_alerts: []

      - eval_time: 15m
        alertname: PatentSearchInstanceNotReady
        exp_alerts:
          - exp_labels:
              severity: critical
              threshold_status: candidate
              job: patent-search-service
              instance: instance-a
              probe: ready
            exp_annotations:
              summary: Patent search instance has remained not-ready for 2 minutes
              possible_causes: Startup incomplete, isolated readiness timeout, or OpenSearch unavailable
              investigation: Check startup and ready probes plus readiness operation outcomes for this instance
              mitigation: Keep the instance out of traffic; restart or roll back only after identifying the failure boundary
              runbook: docs/ops/observability.md#alert-response
      - eval_time: 30m
        alertname: PatentSearchInstanceNotReady
        exp_alerts: []

      - eval_time: 15m
        alertname: PatentSearchProcessRestarted
        exp_alerts:
          - exp_labels:
              severity: warning
              threshold_status: candidate
              job: patent-search-service
              instance: instance-a
            exp_annotations:
              summary: Patent search process start time changed within 15 minutes
              possible_causes: Deployment, operator restart, crash, or service-manager restart loop
              investigation: Correlate the instance start time with deployment records and post-start logs
              mitigation: Stop rollout progression and use the verified rollback revision when restarts are unexpected
              runbook: docs/ops/observability.md#alert-response
      - eval_time: 30m
        alertname: PatentSearchProcessRestarted
        exp_alerts: []

  - name: rolling count alerts catch one-off bursts and recover
    interval: 1m
    input_series:
      - series: 'patent_search_bulkhead_rejections_total{bulkhead="global"}'
        values: '0 0 0 0 0 10 10 10 10 10 10 10'
      - series: 'patent_search_opensearch_calls_total{operation="search",outcome="timeout"}'
        values: '0 0 0 0 0 3 3 3 3 3 3 3'

    alert_rule_test:
      - eval_time: 6m
        alertname: PatentSearchBulkheadRejecting
        exp_alerts:
          - exp_labels: {severity: warning, threshold_status: candidate}
            exp_annotations:
              summary: Patent search bulkheads rejected more than 5 requests in the rolling 5 minute window
              possible_causes: Heavy-search saturation or global application overload
              investigation: Compare global and heavy_search capacity, in-flight, and rejection series
              mitigation: Stop traffic growth; do not raise capacity without Issue 49 calibration evidence
              runbook: docs/ops/observability.md#alert-response
      - eval_time: 11m
        alertname: PatentSearchBulkheadRejecting
        exp_alerts: []

      - eval_time: 6m
        alertname: PatentSearchDependencyTimeouts
        exp_alerts:
          - exp_labels: {severity: critical, threshold_status: candidate}
            exp_annotations:
              summary: Patent search observed more than 2 OpenSearch timeouts in the rolling 5 minute window
              possible_causes: Dependency latency, network timeout, or exhausted request deadline
              investigation: Compare operation outcomes, retry rate, duration histogram, and 50401 responses
              mitigation: Stop the canary or traffic increase and follow the verified service rollback entry
              runbook: docs/ops/observability.md#alert-response
      - eval_time: 11m
        alertname: PatentSearchDependencyTimeouts
        exp_alerts: []

  - name: rolling count alerts remain active during sustained events
    interval: 1m
    input_series:
      - series: 'patent_search_bulkhead_rejections_total{bulkhead="global"}'
        values: '0+2x15'
      - series: 'patent_search_opensearch_calls_total{operation="search",outcome="timeout"}'
        values: '0+1x15'

    alert_rule_test:
      - eval_time: 12m
        alertname: PatentSearchBulkheadRejecting
        exp_alerts:
          - exp_labels: {severity: warning, threshold_status: candidate}
            exp_annotations:
              summary: Patent search bulkheads rejected more than 5 requests in the rolling 5 minute window
              possible_causes: Heavy-search saturation or global application overload
              investigation: Compare global and heavy_search capacity, in-flight, and rejection series
              mitigation: Stop traffic growth; do not raise capacity without Issue 49 calibration evidence
              runbook: docs/ops/observability.md#alert-response
      - eval_time: 12m
        alertname: PatentSearchDependencyTimeouts
        exp_alerts:
          - exp_labels: {severity: critical, threshold_status: candidate}
            exp_annotations:
              summary: Patent search observed more than 2 OpenSearch timeouts in the rolling 5 minute window
              possible_causes: Dependency latency, network timeout, or exhausted request deadline
              investigation: Compare operation outcomes, retry rate, duration histogram, and 50401 responses
              mitigation: Stop the canary or traffic increase and follow the verified service rollback entry
              runbook: docs/ops/observability.md#alert-response

  - name: prometheus storage budget alerts and recovers
    interval: 1m
    input_series:
      - series: 'prometheus_tsdb_storage_blocks_bytes{job="prometheus",instance="internal-test"}'
        values: '900x16 500x15'
      - series: 'prometheus_tsdb_retention_limit_bytes{job="prometheus",instance="internal-test"}'
        values: '1000x31'

    alert_rule_test:
      - eval_time: 12m
        alertname: PatentSearchPrometheusStorageBudgetHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              threshold_status: deployment_budget
              job: prometheus
              instance: internal-test
            exp_annotations:
              summary: Patent search Prometheus TSDB blocks exceed 80% of the configured size budget
              possible_causes: Unexpected series growth, a scrape-label regression, or delayed block retention
              investigation: Compare storage block bytes, retention limit bytes, active series, and filesystem free space
              mitigation: Stop adding targets; preserve evidence and reduce retention only through the verified deployment rollback procedure
              runbook: docs/ops/internal_prometheus.md#storage-budget-response
      - eval_time: 28m
        alertname: PatentSearchPrometheusStorageBudgetHigh
        exp_alerts: []
