[Unit]
Requires=systemd-journald@patent-search.service
After=systemd-journald@patent-search.service

[Service]
# Required only when ADMIN_ENABLED=true and ADMIN_LOG_SOURCE=journal.
# This dedicated group receives read ACLs only on the patent-search namespace.
SupplementaryGroups=patent-search-journal-readers
# Reapply ACLs after the namespace directories exist, including after reboot.
ExecStartPre=+/usr/bin/systemd-tmpfiles --create /etc/tmpfiles.d/patent-search-admin-journal.conf
