name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: make PYTHON=python check
      - name: Check Prometheus rules
        shell: bash
        run: |
          set -euo pipefail
          source deployment/prometheus/version.env
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          destination="${RUNNER_TEMP}/patent-search-promtool"
          mkdir -p "${destination}"
          curl --fail --location --retry 3 \
            --output "${destination}/${archive}" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${archive}"
          echo "${PROMETHEUS_LINUX_AMD64_SHA256}  ${destination}/${archive}" \
            | sha256sum --check --strict
          tar -xzf "${destination}/${archive}" -C "${destination}"
          make \
            PROMTOOL="${destination}/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" \
            check-observability
